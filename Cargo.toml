[package]
name = "hermes-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Templating
handlebars = "4.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Environment and configuration
dotenvy = "0.15"
clap = { version = "4.4", features = ["derive", "env"] }
lapin = "4.12.3"
async-nats = "0.53.0"
futures-util = "0.3.34"
bytes = "1.12.2"
uuid = { version = "1.29.3", features = ["v4"] }
fastrand = "2.5.0"

[dev-dependencies]
tempfile = "3.8"
