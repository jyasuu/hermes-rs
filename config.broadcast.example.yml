# Durable queue behind `mode: async` registers (all optional)
outbox:
  path: /data/outbox.db         # HERMES_OUTBOX_PATH overrides; keep it on a persistent volume
  workers: 4
  max_pending: 100000           # beyond this, new async webhooks get 503 + Retry-After
  retry:                        # patient defaults: nobody is waiting on a background retry
    attempts: 8                 # 1s, 2s, 4s … capped at max_delay_ms
    max_delay_ms: 300000

# Global defaults (all optional)
settings:
  retry_attempts: 3            # total tries per target, 1 = never retry
  retry_delay_ms: 1000         # first wait; doubles each retry (+jitter)
  circuit_breaker:
    enabled: true
    failure_threshold: 5       # consecutive unhealthy attempts before skipping a destination
    cooldown_secs: 30          # then one probe is allowed through

# Example: one inbound webhook, broadcast to HTTP + RabbitMQ + NATS.
# Run:  hermes-admin validate-config -c config.broadcast.example.yml
registers:
  - endpoint: /webhook/github
    method: POST
    # all (default): every target must succeed, otherwise 502
    # any:           at least one must succeed
    # best_effort:   always 200; inspect `results` in the response body
    delivery: all
    retry_config:              # register-wide override of `settings`
      attempts: 4
      delay_ms: 500
      backoff_multiplier: 2.0
      max_delay_ms: 10000
      max_elapsed_ms: 15000    # stop retrying after 15s total (null = no limit)
      jitter: true
    template: |
      {"event": "{{ action }}", "repository": "{{ repository.name }}"}
    targets:
      - name: audit-log                # type defaults to http
        url: http://audit.internal/ingest
        headers: { Authorization: "Bearer change-me" }
        timeout_seconds: 5
        retry: { attempts: 2 }         # per-target override beats register + settings

      - name: events-bus
        type: rabbitmq
        url: amqp://guest:guest@rabbitmq:5672/%2f
        exchange: hermes.events
        exchange_type: topic           # declared (durable) on first use
        routing_key: github.webhook
        queue: hermes.github           # optional: declare + bind a durable queue
        persistent: true
        mandatory: true                # unroutable message => failure
        headers: { X-Source: hermes }

      - name: nats-fanout
        type: nats
        url: nats://nats:4222
        subject: hooks.github

      - name: nats-durable
        type: nats
        url: nats://nats:4222
        subject: js.github             # must be captured by an existing stream
        jetstream: true
        template: |                    # per-target template override
          {"kind": "github", "action": "{{ action }}"}

  # Async: answer 202 as soon as the job is safely on disk, deliver in the background.
  # Survives crashes and restarts; failures end up as replayable dead letters.
  - endpoint: /webhook/stripe
    method: POST
    mode: async
    template: '{"type": "{{ type }}"}'
    targets:
      - { name: billing, url: "http://billing.internal/events" }
      - { name: bus, type: nats, url: "nats://nats:4222", subject: js.stripe, jetstream: true }
