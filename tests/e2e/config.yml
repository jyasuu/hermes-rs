# Old scenarios: no retries. New retry/breaker scenarios set their own policy.
outbox:                      # path comes from HERMES_OUTBOX_PATH (set by run.py)
  workers: 2
  poll_interval_ms: 100
  lease_secs: 60
settings:
  retry_attempts: 1
  circuit_breaker: { failure_threshold: 4, cooldown_secs: 3 }

registers:
  # Legacy syntax, no `type:` — must behave exactly as before
  - endpoint: /webhook/legacy
    method: POST
    target:
      url: http://127.0.0.1:3000/debug
      method: POST
      headers: { X-Custom-Header: "hermes-rs" }
    template: '{"msg": "Hello {{ escapeNewlines message }}"}'

  # Full broadcast: http + rabbitmq (fanout exchange + bound queue) + nats core + jetstream
  - endpoint: /webhook/fan
    method: POST
    template: '{"event": "{{ action }}", "who": "{{ user }}"}'
    targets:
      - { name: audit-http, url: "http://127.0.0.1:3000/debug" }
      - name: rmq-fanout
        type: rabbitmq
        url: "amqp://guest:guest@127.0.0.1:5672/%2f"
        exchange: hermes.events
        exchange_type: fanout
        queue: hermes.events.q
        headers: { X-Source: hermes }
      - name: rmq-direct-queue
        type: rabbitmq
        url: "amqp://guest:guest@127.0.0.1:5672/%2f"
        routing_key: hermes.direct.q
        queue: hermes.direct.q
        persistent: false
      - { name: nats-core, type: nats, url: "nats://127.0.0.1:4222", subject: hooks.fan, headers: { X-Source: hermes } }
      - name: nats-js
        type: nats
        url: "nats://127.0.0.1:4222"
        subject: js.fan
        jetstream: true
        template: '{"js": true, "event": "{{ action }}"}'

  # delivery: any — one dead target, one healthy => 200 "partial"
  - endpoint: /webhook/any
    method: POST
    delivery: any
    template: '{"n": 1}'
    targets:
      - { name: dead, url: "http://127.0.0.1:9/nope", timeout_seconds: 2 }
      - { name: alive, type: nats, url: "nats://127.0.0.1:4222", subject: hooks.any }

  # delivery: all (default) — same mix => 502
  - endpoint: /webhook/all
    method: POST
    template: '{"n": 1}'
    targets:
      - { name: dead, url: "http://127.0.0.1:9/nope", timeout_seconds: 2 }
      - { name: alive, type: nats, url: "nats://127.0.0.1:4222", subject: hooks.all }

  # mandatory publish to an exchange with no bound queue => unroutable => failure
  - endpoint: /webhook/unroutable
    method: POST
    template: '{"n": 1}'
    target:
      type: rabbitmq
      url: "amqp://guest:guest@127.0.0.1:5672/%2f"
      exchange: hermes.nowhere
      exchange_type: direct
      routing_key: nothing

  # --- reliability scenarios (served by the test's own HTTP server) ---
  # 500, 500, then 200  => 3 attempts, same Idempotency-Key each time
  - endpoint: /webhook/flaky
    method: POST
    template: '{"n": 1}'
    retry_config: { attempts: 4, delay_ms: 100, backoff_multiplier: 2.0, jitter: false }
    target: { url: "http://127.0.0.1:3999/flaky" }

  # 400 is final: must NOT be retried
  - endpoint: /webhook/permanent
    method: POST
    template: '{"n": 1}'
    retry_config: { attempts: 4, delay_ms: 50 }
    target: { url: "http://127.0.0.1:3999/perm" }

  # 429 + Retry-After: 1 => waits >= 1s even though delay_ms is 50
  - endpoint: /webhook/ratelimited
    method: POST
    template: '{"n": 1}'
    retry_config: { attempts: 3, delay_ms: 50, jitter: false }
    target: { url: "http://127.0.0.1:3999/rl" }

  # connection refused, 400ms apart, but only ~1s of retry budget
  - endpoint: /webhook/budget
    method: POST
    template: '{"n": 1}'
    retry_config: { attempts: 10, delay_ms: 400, backoff_multiplier: 1.0, jitter: false, max_elapsed_ms: 1000 }
    target: { url: "http://127.0.0.1:9/budget" }

  # per-target retry beats register retry_config
  - endpoint: /webhook/override
    method: POST
    template: '{"n": 1}'
    retry_config: { attempts: 5, delay_ms: 10 }
    target: { url: "http://127.0.0.1:3999/always500", retry: { attempts: 2, delay_ms: 10 } }

  # nothing listens on :3998 at first => breaker opens; later the server appears
  - endpoint: /webhook/breaker
    method: POST
    template: '{"n": 1}'
    retry_config: { attempts: 1 }
    target: { url: "http://127.0.0.1:3998/ping" }

  # ================= async mode (durable outbox) =================
  # http fails twice then succeeds, plus nats + rabbitmq; one shared idempotency key
  - endpoint: /webhook/async-fan
    method: POST
    mode: async
    template: '{"event": "{{ action }}"}'
    retry_config: { attempts: 5, delay_ms: 200, backoff_multiplier: 1.0, jitter: false }
    targets:
      - { name: aflaky, url: "http://127.0.0.1:3999/aflaky" }
      - { name: nats-a, type: nats, url: "nats://127.0.0.1:4222", subject: hooks.async }
      - { name: rmq-a, type: rabbitmq, url: "amqp://guest:guest@127.0.0.1:5672/%2f", routing_key: hermes.async.q, queue: hermes.async.q }

  # always 500 until the test flips a switch => dead letter => replay
  - endpoint: /webhook/async-dlq
    method: POST
    mode: async
    template: '{"n": 1}'
    retry_config: { attempts: 2, delay_ms: 100, jitter: false }
    target: { name: dlq, url: "http://127.0.0.1:3999/dlq" }

  # destination is down while messages arrive; Hermes is killed and restarted
  - endpoint: /webhook/async-crash
    method: POST
    mode: async
    template: '{"n": 1}'
    retry_config: { attempts: 50, delay_ms: 300, backoff_multiplier: 1.0, max_delay_ms: 300, jitter: false, max_elapsed_ms: null }
    target: { name: crash, url: "http://127.0.0.1:3997/crash" }

  # slow destination: Hermes is killed while the request is in flight
  - endpoint: /webhook/async-slow
    method: POST
    mode: async
    template: '{"n": 1}'
    retry_config: { attempts: 5, delay_ms: 200, jitter: false }
    target: { name: slow, url: "http://127.0.0.1:3999/slow" }

  # template renders invalid JSON: must be rejected up front, nothing queued
  - endpoint: /webhook/async-badtpl
    method: POST
    mode: async
    template: '{"a": {{ nothing_here }} }'
    target: { url: "http://127.0.0.1:3999/never" }
